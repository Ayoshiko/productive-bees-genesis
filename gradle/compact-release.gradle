import org.gradle.process.ExecOperations
import javax.inject.Inject

abstract class CompactReleaseExecution {
    @Inject
    abstract ExecOperations getExecOperations()
}

// Uses the project's Java 21 toolchain; build helpers never enter the mod.
def compactLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def compactExecution = objects.newInstance(CompactReleaseExecution)
def compactSource = file('gradle/CompactReleaseJar.java')
def compactReport = layout.buildDirectory.file('reports/release-compaction.txt')
tasks.named('jar', Jar) {
    inputs.file(compactSource)
    inputs.file('gradle/compact-release.gradle')
    outputs.file(compactReport)
    def artifact = archiveFile
    doLast {
        compactExecution.execOperations.exec {
            executable compactLauncher.get().executablePath.asFile
            args compactSource.absolutePath, artifact.get().asFile.absolutePath,
                    compactReport.get().asFile.absolutePath
        }
    }
}

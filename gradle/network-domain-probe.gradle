sourceSets {
    domainProbe {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    domainProbeImplementation.extendsFrom implementation
    domainProbeCompileOnly.extendsFrom compileOnly
    domainProbeRuntimeOnly.extendsFrom runtimeOnly
}

def runId = providers.gradleProperty('networkProbeRun').getOrElse('d04')
if (!(runId ==~ /[a-zA-Z0-9_-]+/)) throw new GradleException('Invalid network probe run id')
def probeDirectory = layout.buildDirectory.dir("network-probe-${runId}")
def coldProbe = providers.gradleProperty('networkColdProbe').isPresent()
def probeAe2 = providers.gradleProperty('networkProbeAe2').isPresent()
def multiblockMode = providers.gradleProperty('networkMultiblockMode').orNull
def machineMenuProbe = providers.gradleProperty('networkMachineMenu').isPresent()
def machineProduction = providers.gradleProperty('networkMachineProduction').isPresent()
if (machineProduction && !(multiblockMode in ['write', 'read'])) throw new GradleException('Machine production requires write/read mode')
if (multiblockMode != null && !(multiblockMode in ['lifecycle', 'write', 'read'])) throw new GradleException('Invalid multiblock mode')
def automaticMode = providers.gradleProperty('networkAutomaticMode').orNull
def upgradeProbe = providers.gradleProperty('networkUpgradeProbe').isPresent()
if (upgradeProbe && (automaticMode != null || multiblockMode != null || coldProbe ||
        ['networkOwnershipMode', 'networkCentrifugeMode', 'networkRestoreMode', 'networkPlayerMode'].any { providers.gradleProperty(it).isPresent() })) {
    throw new GradleException('Upgrade step probe cannot be combined with another probe mode')
}
if (automaticMode != null && !(automaticMode in ['write', 'read'])) throw new GradleException('Invalid automatic restart mode')
def playerConcurrent = providers.gradleProperty('networkConcurrentProbe').isPresent()
def terminalPermissions = providers.gradleProperty('networkConcurrentTerminals').isPresent()
def craftingProbe = providers.gradleProperty('networkConcurrentCrafting').isPresent()
def recipeFillProbe = providers.gradleProperty('networkRecipeFill').isPresent()
if (recipeFillProbe && (!craftingProbe || providers.gradleProperty('networkConcurrentWireless').isPresent())) throw new GradleException('Recipe fill requires a separate crafting fixture')
def meBridgeProbe = providers.gradleProperty('networkMeBridge').isPresent()
if (meBridgeProbe && (!playerConcurrent || craftingProbe || terminalPermissions || providers.gradleProperty('networkConcurrentUpgrades').isPresent())) throw new GradleException('ME bridge requires its separate concurrent fixture')
def wirelessProbe = providers.gradleProperty('networkConcurrentWireless').isPresent()
def wirelessVisualOnly = providers.gradleProperty('networkWirelessVisualOnly').isPresent()
if (wirelessVisualOnly && !wirelessProbe) throw new GradleException('Wireless visual follow-up requires wireless mode')
if (wirelessProbe && !craftingProbe) throw new GradleException('Wireless probe extends the crafting fixture')
if (craftingProbe && (!playerConcurrent || terminalPermissions || providers.gradleProperty('networkConcurrentUpgrades').isPresent())) {
    throw new GradleException('Crafting probe requires its separate concurrent fixture')
}
if (terminalPermissions && (!playerConcurrent || providers.gradleProperty('networkConcurrentUpgrades').isPresent())) {
    throw new GradleException('Terminal permission mode requires concurrent players and its separate fixture')
}
def playerMode = providers.gradleProperty('networkPlayerMode').orNull
if (playerMode != null && !(playerMode in ['write', 'read'])) throw new GradleException('Invalid player login mode')
if (playerMode == null && gradle.startParameter.taskNames.any { it.tokenize(':').last() in ['runNetworkPlayerServer', 'runNetworkPlayerClient', 'runNetworkConcurrentServer', 'runNetworkConcurrentOwner', 'runNetworkConcurrentGuest'] }) {
    throw new GradleException('Player probes require -PnetworkPlayerMode=write or read')
}
if (playerMode != null && (automaticMode != null || multiblockMode != null || coldProbe)) throw new GradleException('Conflicting player probe mode')
def playerExchange = providers.gradleProperty('networkPlayerExchange').isPresent()
def playerRole = providers.gradleProperty('networkPlayerRole').getOrElse('owner')
if (!(playerRole in ['owner', 'guest', 'stranger'])) throw new GradleException('Invalid player role')
if (playerExchange && playerMode == null) throw new GradleException('Guest exchange requires a player mode')
if (playerConcurrent && (playerMode == null || playerExchange)) throw new GradleException('Concurrent mode needs a player mode and cannot use the sequential fixture')
def playerPort = providers.gradleProperty('networkPlayerPort').getOrElse(playerConcurrent ? '25583' : '25582')
if (!(playerPort ==~ /[0-9]{4,5}/) || playerPort.toInteger() < 1024 || playerPort.toInteger() > 65535) throw new GradleException('Invalid local player port')
def probeEula = file('run/eula.txt')
def seedWorld = providers.gradleProperty('networkProbeSeedWorld').isPresent()
        ? file(providers.gradleProperty('networkProbeSeedWorld').get()) : null
if (playerMode == 'read' && seedWorld == null) throw new GradleException('Player reader requires its stopped writer world')
if (playerMode == 'write' && seedWorld != null) throw new GradleException('Player writer requires a fresh world')
if (automaticMode == 'read' && seedWorld == null) throw new GradleException('Automatic restart requires its saved fixture world')
if (multiblockMode == 'read' && seedWorld == null) throw new GradleException('Machine restart reader requires saved writer world')
if (multiblockMode == 'write' && seedWorld != null) throw new GradleException('Machine restart writer requires fresh world')
if (automaticMode == 'write' && seedWorld != null) throw new GradleException('Automatic writer requires a fresh world')
if (automaticMode != null && (coldProbe || ['networkOwnershipMode', 'networkCentrifugeMode', 'networkRestoreMode'].any { providers.gradleProperty(it).isPresent() })) {
    throw new GradleException('Automatic restart cannot be combined with another probe mode')
}
def probeDependencies = [file('run/mods/igleelib-1.21.1-1.2.7.jar')]
if (probeAe2) {
    probeDependencies.addAll(['appliedenergistics2-1.21.1-19.2.17.jar', 'AppliedFlux-1.21-2.1.5-neoforge.jar'].collect { file('libs/' + it) })
    probeDependencies.addAll(['guideme-21.1.16.jar', 'Glodium-1.21-2.2-neoforge.jar'].collect { file('run/mods/' + it) })
}
def prepareProbe = tasks.register('prepareNetworkDomainProbe') {
    doLast {
        File directory = probeDirectory.get().asFile
        if (directory.exists()) throw new GradleException('Use a new networkProbeRun; existing evidence is preserved')
        File eula = probeEula
        if (!eula.isFile() || !eula.getText('UTF-8').contains('eula=true')) {
            throw new GradleException('Probe requires the already accepted local EULA')
        }
        directory.mkdirs()
        if (seedWorld != null) {
            File sourceWorld = seedWorld
            def marker = playerConcurrent ? 'concurrent-probe.dat' : playerMode == 'read' ? 'player-login-probe.dat' : multiblockMode == 'read' ? 'multiblock-probe.dat' : automaticMode != null ? 'automatic-probe.dat' : providers.gradleProperty('networkCentrifugeMode').isPresent() ? 'centrifuge-probe.dat' : 'ownership-probe.dat'
            if (!sourceWorld.isDirectory() || !new File(sourceWorld, marker).isFile()) throw new GradleException('Missing restart fixture world')
            if (playerMode == 'read' && playerConcurrent) {
                File report = new File(sourceWorld.parentFile, 'results/concurrent-server.json')
                if (!report.isFile()) throw new GradleException('Missing concurrent writer report')
                def writer = new groovy.json.JsonSlurper().parse(report)
                if (writer.passed != true || writer.normalPlayerFilesVerified != true || writer.mode != 'write' || writer.ae2Loaded != probeAe2) {
                    throw new GradleException('Concurrent reader requires its successfully stopped writer')
                }
            }
            if (playerMode == 'read' && !playerConcurrent) {
                File writerReport = new File(sourceWorld.parentFile, 'results/player-login-server.json')
                if (!writerReport.isFile()) throw new GradleException('Missing player writer report')
                def writer = new groovy.json.JsonSlurper().parse(writerReport)
                if (writer.passed != true || writer.normalPlayerFileVerified != true || writer.mode != 'write' || writer.ae2Loaded != probeAe2 || (writer.guestExchange == true) != playerExchange) {
                    throw new GradleException('Player reader requires successfully stopped matching writer')
                }
            }
            if (multiblockMode == 'read') {
                File writerReport = new File(sourceWorld.parentFile, 'results/multiblock.json')
                if (!writerReport.isFile()) throw new GradleException('Missing machine writer report')
                def writer = new groovy.json.JsonSlurper().parse(writerReport)
                if (writer.passed != true || writer.normalShutdown != true || writer.mode != 'write' || writer.ae2Loaded != probeAe2 || (writer.production == true) != machineProduction) {
                    throw new GradleException('Machine reader requires successfully stopped matching writer')
                }
            }
            if (automaticMode == 'read') {
                File writerReport = new File(sourceWorld.parentFile, 'results/domain.json')
                if (!writerReport.isFile()) throw new GradleException('Missing automatic writer shutdown report')
                def writer = new groovy.json.JsonSlurper().parse(writerReport)
                if (!writer.passed || !writer.normalShutdownCheckpointSaved || writer.automaticRestartIsNewJvm != false) {
                    throw new GradleException('Automatic reader requires a successfully stopped writer')
                }
            }
            def target = new File(directory, 'world').toPath()
            java.nio.file.Files.walk(sourceWorld.toPath()).withCloseable { paths ->
                paths.forEach { path ->
                    def destination = target.resolve(sourceWorld.toPath().relativize(path))
                    if (java.nio.file.Files.isDirectory(path)) java.nio.file.Files.createDirectories(destination)
                    else java.nio.file.Files.copy(path, destination)
                }
            }
        }
        new File(directory, 'eula.txt').setText(eula.getText('UTF-8'), 'UTF-8')
        // Fresh probe directories otherwise open the language/accessibility onboarding screen.
        new File(directory, 'options.txt').setText('lang:zh_cn\nonboardAccessibility:false\n', 'UTF-8')
        new File(directory, 'server.properties').setText('''server-ip=127.0.0.1
server-port=25581
online-mode=false
level-name=world
level-seed=18092026
level-type=minecraft:flat
generate-structures=false
view-distance=3
simulation-distance=3
max-tick-time=-1
''', 'UTF-8')
        if (playerMode != null) {
            def properties = new File(directory, 'server.properties')
            properties.setText(properties.getText('UTF-8').replace('server-port=25581', "server-port=${playerPort}") + 'enforce-secure-profile=false\n', 'UTF-8')
        }
        File mods = new File(directory, 'mods')
        mods.mkdirs()
        for (File dependency : probeDependencies) {
            java.nio.file.Files.copy(dependency.toPath(), new File(mods, dependency.name).toPath())
        }
    }
}
neoForge {
    addModdingDependenciesTo sourceSets.domainProbe
    mods.named(mod_id.toString()) { sourceSet(sourceSets.domainProbe) }
    runs {
        networkConcurrentServer {
            server()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            programArgument '--nogui'
            systemProperty 'pbg.concurrent.server', 'true'
            systemProperty 'pbg.concurrent.mode', playerMode ?: 'write'
            systemProperty 'pbg.concurrent.upgrades', providers.gradleProperty('networkConcurrentUpgrades').isPresent().toString()
            systemProperty 'pbg.concurrent.terminals', terminalPermissions.toString()
            systemProperty 'pbg.concurrent.crafting', craftingProbe.toString()
            systemProperty 'pbg.concurrent.recipeFill', recipeFillProbe.toString()
            systemProperty 'pbg.concurrent.meBridge', meBridgeProbe.toString()
            systemProperty 'pbg.concurrent.wireless', wirelessProbe.toString()
            systemProperty 'pbg.concurrent.wirelessVisualOnly', wirelessVisualOnly.toString()
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkConcurrentOwner {
            client()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            systemProperty 'pbg.concurrent.client', 'true'
            systemProperty 'pbg.concurrent.mode', playerMode ?: 'write'
            systemProperty 'pbg.concurrent.upgrades', providers.gradleProperty('networkConcurrentUpgrades').isPresent().toString()
            systemProperty 'pbg.concurrent.terminals', terminalPermissions.toString()
            systemProperty 'pbg.concurrent.crafting', craftingProbe.toString()
            systemProperty 'pbg.concurrent.recipeFill', recipeFillProbe.toString()
            systemProperty 'pbg.concurrent.meBridge', meBridgeProbe.toString()
            systemProperty 'pbg.concurrent.wireless', wirelessProbe.toString()
            systemProperty 'pbg.concurrent.wirelessVisualOnly', wirelessVisualOnly.toString()
            systemProperty 'pbg.concurrent.role', 'owner'
            systemProperty 'pbg.concurrent.port', playerPort
            programArguments.addAll('--username', 'PbgLoginOwner', '--width', '1000', '--height', '700')
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkConcurrentGuest {
            client()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            systemProperty 'pbg.concurrent.client', 'true'
            systemProperty 'pbg.concurrent.mode', playerMode ?: 'write'
            systemProperty 'pbg.concurrent.upgrades', providers.gradleProperty('networkConcurrentUpgrades').isPresent().toString()
            systemProperty 'pbg.concurrent.terminals', terminalPermissions.toString()
            systemProperty 'pbg.concurrent.crafting', craftingProbe.toString()
            systemProperty 'pbg.concurrent.recipeFill', recipeFillProbe.toString()
            systemProperty 'pbg.concurrent.meBridge', meBridgeProbe.toString()
            systemProperty 'pbg.concurrent.wireless', wirelessProbe.toString()
            systemProperty 'pbg.concurrent.wirelessVisualOnly', wirelessVisualOnly.toString()
            systemProperty 'pbg.concurrent.role', 'guest'
            systemProperty 'pbg.concurrent.port', playerPort
            programArguments.addAll('--username', 'PbgLoginGuest', '--width', '1000', '--height', '700')
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkPlayerServer {
            server()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            programArgument '--nogui'
            systemProperty 'pbg.login.server', 'true'
            systemProperty 'pbg.exchange.enabled', playerExchange.toString()
            systemProperty 'pbg.login.mode', playerMode ?: 'write'
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkPlayerClient {
            client()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            systemProperty 'pbg.login.client', 'true'
            systemProperty 'pbg.exchange.enabled', playerExchange.toString()
            systemProperty 'pbg.exchange.role', playerRole
            systemProperty 'pbg.login.mode', playerMode ?: 'write'
            systemProperty 'pbg.login.port', playerPort
            programArgument '--username'
            programArgument (playerRole == 'guest' ? 'PbgLoginGuest' : playerRole == 'stranger' ? 'PbgLoginStranger' : 'PbgLoginOwner')
            programArgument '--width'
            programArgument '1000'
            programArgument '--height'
            programArgument '700'
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkMultiblockClient {
            client()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            systemProperty 'pbg.machineClient.enabled', 'true'
            if (machineMenuProbe) systemProperty 'pbg.machineClient.menuOnly', 'true'
            programArgument '--width'
            programArgument '1000'
            programArgument '--height'
            programArgument '700'
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkMultiblockServer {
            server()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            programArgument '--nogui'
            systemProperty 'pbg.multiblock.enabled', 'true'
            if (multiblockMode != null) systemProperty 'pbg.multiblock.mode', multiblockMode
            systemProperty 'pbg.multiblock.production', machineProduction.toString()
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkDomainClient {
            client()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            systemProperty 'pbg.client.enabled', 'true'
            programArgument '--width'
            programArgument '1000'
            programArgument '--height'
            programArgument '700'
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
        networkDomainServer {
            server()
            sourceSet = sourceSets.domainProbe
            gameDirectory = probeDirectory
            programArgument '--nogui'
            systemProperty 'pbg.domain.enabled', 'true'
            if (upgradeProbe) systemProperty 'pbg.upgrades.only', 'true'
            if (automaticMode != null) systemProperty 'pbg.automatic.mode', automaticMode
            if (coldProbe) systemProperty 'pbg.cold.enabled', 'true'
            if (providers.gradleProperty('networkColdReference').isPresent()) systemProperty 'pbg.cold.reference', 'true'
			if (providers.gradleProperty('networkSharedEnergy').isPresent()) systemProperty 'pbg.centrifuge.sharedEnergy', 'true'
			if (providers.gradleProperty('networkCentrifugeMode').isPresent()) {
				def mode = providers.gradleProperty('networkCentrifugeMode').get()
				if (!(mode in ['write', 'read'])) throw new GradleException('Invalid centrifuge restart mode')
				if (mode == 'read' && seedWorld == null) throw new GradleException('Centrifuge restart requires its saved fixture world')
				systemProperty 'pbg.centrifuge.mode', mode
			}
			if (providers.gradleProperty('networkBeeRestartSource').isPresent()) {
				systemProperty 'pbg.bee.restartSource', file(providers.gradleProperty('networkBeeRestartSource').get()).absolutePath
			}
            if (providers.gradleProperty('networkOwnershipMode').isPresent()) {
                def mode = providers.gradleProperty('networkOwnershipMode').get()
                if (!(mode in ['write', 'read'])) throw new GradleException('Invalid ownership mode')
                systemProperty 'pbg.ownership.mode', mode
            }
			if (providers.gradleProperty('networkRestoreMode').isPresent()) {
				systemProperty 'pbg.restore.mode', providers.gradleProperty('networkRestoreMode').get()
				systemProperty 'pbg.restore.report', runId
				systemProperty 'pbg.restore.keys', providers.gradleProperty('networkRestoreKeys').getOrElse('1000000')
				systemProperty 'pbg.restore.folder', file(providers.gradleProperty('networkRestoreFolder').getOrElse('build/reports/network-restore/p2-d09b3')).absolutePath
			}
            logLevel = org.slf4j.event.Level.INFO
            taskBefore prepareProbe
        }
    }
}
// ModDev 的 Run 准备任务也会创建 gameDirectory，必须先完成探针的空目录检查与初始化。
tasks.configureEach {
    if (name in ['prepareNetworkDomainClientRun', 'prepareNetworkDomainServerRun',
                 'prepareNetworkMultiblockClientRun', 'prepareNetworkMultiblockServerRun',
                 'prepareNetworkPlayerClientRun', 'prepareNetworkPlayerServerRun',
                  'prepareNetworkConcurrentServerRun', 'prepareNetworkConcurrentOwnerRun', 'prepareNetworkConcurrentGuestRun']) {
        dependsOn prepareProbe
    }
}
tasks.named('runNetworkMultiblockServer') {
    doLast {
        File report = new File(probeDirectory.get().asFile, 'results/multiblock.json')
        if (!report.isFile()) throw new GradleException('Missing multiblock report')
        def result = new groovy.json.JsonSlurper().parse(report)
        def required = ['allLayoutsFourDirectionsAndParts', 'removalAirObstructionAndTwoRebuilds',
                        'wrongRoleAndFacingRejectedAndRepaired', 'adjacentStructuresRemainIndependent',
                        'sharedWallConflictsDisableBoth', 'noDuplicatedTickersAndCleanup', 'crossThreadRequestRejected',
                        'readOnlyAuditsKeepAllBindingsFor500Ticks', 'boundedVisualFramesRemainStableFor500Ticks']
        if (multiblockMode == 'lifecycle') required = ['silentAirMutationAndRepair', 'auditProgressesWhileAnotherScanKeepsQueueBusy',
                'twoRealPartialChunkAvailabilityLossesAndReloads', 'missingChunkNotForceLoadedAndOldBindingRevoked',
                'controllerUnloadRecreatesHandleAndKeepsOwner', 'duplicateControllerReplayAndRecovery', 'malformedIdentityFailsClosed', 'cleanup',
                'waitingStateProjectedWithoutChunkLoad', 'assetAccessClosesAndRootSurvivesRealUnload', 'removedControllerKeepsAssetsWithoutAccess',
                'rolePortsFaceComponentsLimitsAndSimulation', 'portCachesStayRevokedAcrossUnloadAndReformation']
        if (multiblockMode in ['write', 'read']) {
            required = ['identityOwnerAndGenerationRetained', 'formalQueueReformedAndPartsBound', 'malformedIdentityRemainsIsolated', 'singleRegisteredController', 'normalAssetCheckpointSaved']
            if (multiblockMode == 'read') required += ['noFormedAuthorityBeforeFirstTick', 'newJvm', 'normalWorkCheckpointRestoredBeforeFormation',
                    'singleTickWorkAndPaidRecovery', 'sixSlotFeedingSurvivesRestartAndWork', 'missingAndUnreadableFilesNeverRecreated', 'recoveryQuarantineRevokesAuthority']
        }
        if (machineProduction) {
            required = ['twoLayoutsOneCapacityEach', 'fullBufferStableFor40Ticks', 'tickAccountingConserved',
                    'noWorldDrops', 'normalAssetCheckpointSaved']
            if (multiblockMode == 'write') required += ['realScheduledProductionAndReference', 'localUpgradePreservesOldAndOtherWork']
            else required += ['checkpointRestoredBeforeFormation', 'newJvm', 'partialDeliveryAndProductionResumed',
                    'finalProductsEnergyAndReturnedAssetsConserved']
        }
        if (result.passed != true || result.normalShutdown != true || required.any { result[it] != true }
                || (result.production == true) != machineProduction
                || result.ae2Loaded != probeAe2
                || (multiblockMode != null && result.mode != multiblockMode)
                || (!(multiblockMode in ['write', 'read']) && (!(result.maxStructureSteps instanceof Number) || result.maxStructureSteps < 1 || result.maxStructureSteps > 32))) {
            throw new GradleException('Multiblock assertions failed or incomplete')
        }
    }
}

tasks.named('runNetworkMultiblockClient') {
    doLast {
        File report = new File(probeDirectory.get().asFile, 'results/machine-client.json')
        if (!report.isFile()) throw new GradleException('Missing machine client report')
        def result = new groovy.json.JsonSlurper().parse(report)
        def required = ['passed', 'simplifiedChineseWithoutOnboarding', 'versionedFramesForSixLayoutsWithoutAuthority', 'fourDirectionsAndInitialChunkStates', 'allElevenCreativeItems', 'unformedUpdate',
                'checkingUpdate', 'reformedUpdate', 'duplicateFaultUpdate', 'resourceReloadKeepsModelsAndStates',
                'oldFrameRejectedAfterRebuild', 'unloadAndRetrackingRestoreFullFrame',
                'coreVerticesMatchSixLayoutsFourDirectionsAndFiniteBounds', 'sharedSixteenDetailedScenesAndStaticOverflow', 'coreFollowsRealPauseAndResume', 'coreBudgetClearedOnWorldDisconnect', 'effectSettingsGuiSavedAndReloaded', 'reducedAndDisabledCoreKeepStaticFallback', 'enlargedProceduralMeshPreview', 'orbitMotionSequence', 'inactiveSceneEmitsNoVertices', 'sceneResourcesRebuiltAfterReload', 'fourObliqueSceneViews',
                'activityClearedOnStructureInvalidation', 'activityIdentityAndDuplicateRejected', 'activityClearedOnResourceReload',
                'activityClearedOnUntracking', 'activityFollowsRealPauseAndResume', 'activityClearedOnWorldDisconnect',
                'fortyStaticStateModelsAndGlyphDirections', 'transparentWindowLayer', 'emissiveGlyphsWithoutWorldLight', 'normalIntegratedShutdown']
        boolean menuOnly = machineMenuProbe
        if (menuOnly) required = ['passed', 'simplifiedChineseWithoutOnboarding', 'machineMenuRealClientExchange', 'normalIntegratedShutdown']
        if (required.any { result[it] != true } || result.ae2Loaded != probeAe2
                || (!menuOnly && (result.detailedVertices != 11928 || result.reducedVertices != 1008))) throw new GradleException('Machine visual checks failed or incomplete')
    }
}

tasks.named('runNetworkDomainClient') {
    doLast {
        File report = new File(probeDirectory.get().asFile, 'results/client.json')
        if (!report.isFile() || !new groovy.json.JsonSlurper().parse(report).passed) {
            throw new GradleException('Network client assertions did not complete')
        }
    }
}
tasks.named('runNetworkDomainServer') {
    doLast {
        File report = new File(probeDirectory.get().asFile, 'results/domain.json')
        if (!report.isFile()) throw new GradleException('Network domain report is missing')
        def result = new groovy.json.JsonSlurper().parse(report)
        def shutdownSaved = upgradeProbe
                ? result.scope == 'upgrades' && result.apiaryUpgradeShutdownSaved == true
                : result.normalShutdownCheckpointSaved == true
        if (result.passed != true || (!coldProbe && !shutdownSaved)) {
            throw new GradleException('Network domain assertions did not complete')
        }
    }
}


plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
jarJar.enable()
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '1000']
    // The Mixin annotation processor regenerates the whole refmap only on a full
    // compile; incremental compilation would shrink it to the last changed files.
    options.incremental = false
}
minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { productivebeesgenesis { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
repositories {
    flatDir { dirs 'libs' }
    if (file('.cached-maven').isDirectory()) { maven { url = uri('.cached-maven') } }
    mavenCentral()
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
    implementation fg.deobf('maven.modrinth:productivebees:mywVOObd')
    implementation fg.deobf('local:productivelib:1.20.1-0.0.4')
    jarJar('io.github.llamalad7:mixinextras-forge:0.5.5') { jarJar.ranged(it, '[0.5.5,)') }
    compileOnly files('libs/mixinextras-common-0.5.5.jar')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:7148487')
    compileOnly fg.deobf('curse.maven:applied-flux-965012:7072853')
    compileOnly fg.deobf('curse.maven:mekanism-extras-1026040:8247562')
    compileOnly fg.deobf('curse.maven:evolved-mekanism-extras-1268159:8472135')
    compileOnly fg.deobf('curse.maven:evolved-mekanism-1230085:7117024')
    compileOnly fg.deobf('maven.modrinth:jade:xJQHCmWJ')
    compileOnly fg.deobf('maven.modrinth:kubejs:hVR2xUSr')
    compileOnly fg.deobf('maven.modrinth:rhino:uNALdylI')
    compileOnly fg.deobf('curse.maven:jei-238222:7037120')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor files('libs/mixinextras-common-0.5.5.jar')
}
sourceSets.main.resources.srcDir 'src/generated/resources'
// Exact JDTE Forge 1.20.1 API source, compiled for type checking only.
// Its classes must never be included in our main JAR or runtime classpath.
sourceSets {
    jdteApi { java.srcDir 'src/compatApi/jdte' }
}
dependencies { compileOnly sourceSets.jdteApi.output }
mixin {
    add sourceSets.main, 'productivebeesgenesis.refmap.json'
    config 'productivebeesgenesis.mixins.json'
}
tasks.named('jar', Jar).configure {
    manifest.attributes('MixinConfigs': 'productivebeesgenesis.mixins.json')
    finalizedBy 'reobfJar'
}
tasks.matching { it.name in ['reobfJar', 'reobfJarJar'] }.configureEach { useArgsFile() }

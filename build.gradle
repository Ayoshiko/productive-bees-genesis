plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url "https://maven.aliyun.com/repository/public/" }
    maven { url "https://maven.aliyun.com/repository/google/" }
    maven { url "https://repo.huaweicloud.com/repository/maven/" }
    maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        url "https://spongepowered.org/maven/"
    }
    maven {
        url "https://modmaven.dev/mekanism/Mekanism/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArgument '--mod'
            programArgument project.mod_id
            programArgument '--all'
            programArgument '--output'
            programArgument file('src/generated/resources').absolutePath
            programArgument '--existing'
            programArgument file('src/main/resources').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 模板文件处理 - 生成模组元数据
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir 'src/generated/resources'
// datagen 哈希缓存（.cache）仅用于增量生成，不进入运行时 JAR，减小模组体积
sourceSets.main.resources.exclude '.cache/**'
// 本地材质备份/预览只用于开发，不允许随资源目录误入发布包
sourceSets.main.resources.exclude '**/texture_backups/**', '**/tmp_*/**', '**/*backup*'
neoForge.ideSyncTask generateModMetadata

dependencies {
    implementation name: 'productivebees-1.21.1-13.13.5'
    implementation name: 'productivelib-1.21.1-0.2.0'

    // RenderBlender 渲染库：官方仅支持 1.20.1，不兼容 1.21.1
    // cosmic 渲染特效将采用自研 shader 方案实现，无需外部依赖

    // Mekanism完整类路径（开发时需要访问Mekanism内部类，如GUI基类、槽位等）
    // implementation 已包含 runtimeOnly，无需重复声明
    implementation name: 'Mekanism-1.21.1-10.7.19.85'

    // Mekanism Extras（可选依赖，编译时需要访问ME的ExtraFactory等类）
    // v1.4.1：AdvancedTier.getColor() 对 COSMIC/INFINITE 返回动态变色（TierColor 每客户端tick刷新）
    // 编译用 1.4.1（API 兼容 1.4.0），运行时用 1.4.0（整合包主流稳定版）验证向后兼容：
    // 我们引用的 API（ExtraUpgrade/AdvancedTier/ExtraAttributeTier/IMixinMachineEnergyContainer）
    // 在 1.4.0 中签名一致；变色效果仅在玩家安装 1.4.1+ 时生效，旧版自动降级为静态颜色
    compileOnly name: 'mekanism_extras-1.21.1-1.4.1'
    // ME本体（测试环境运行时依赖 — 刻意使用 1.4.0 稳定版，确保多数玩家的旧版环境兼容）
    runtimeOnly name: 'mekanism_extras-1.21.1-1.4.0'

    // EvolvedMekanism（可选依赖，编译时需要访问EM的FactoryTier等类）
    compileOnly name: 'Evolved Mekanism-1.21.1-1.2.1-fix3'
    // EM本体（测试环境运行时依赖）
    runtimeOnly name: 'Evolved Mekanism-1.21.1-1.2.1-fix3'

    // EvolvedMekanismExtras（可选依赖，编译时需要访问EME的EMExtraFactory等类）
    compileOnly files('libs/EvolvedMekanismExtras-1.21.1-1.2.1.jar')
    // EME本体（测试环境运行时依赖）
    runtimeOnly files('libs/EvolvedMekanismExtras-1.21.1-1.2.1.jar')

    // MekanismEmpowered（可选依赖，通过反射访问MekEmpUpgrade，编译时无需jar）
    // 注意：不添加 runtimeOnly 依赖 — MekanismEmpowered 的 NeoForge 版本与开发环境不兼容，
    // 且与 MekanismUnleashed 冲突，无法在开发环境运行时测试。反射访问在用户生产环境自动生效。

    // JDTE（可选联动：CoalescedAcceleratedMachine 合并接口，仅编译期引用；运行时经 MixinConfigPlugin 条件应用）
    compileOnly files('libs/jdte-0.5.9-alpha1.jar')

    // Mixin 编译时依赖（运行时由 NeoForge 提供）
    compileOnly files('libs/sponge-mixin.jar')

    // JEI API（仅编译时需要，运行时由JEI提供）
    compileOnly files('libs/jei-1.21.1-neoforge-19.36.0.360.jar')
    // JEI本体（测试环境运行时依赖）
    runtimeOnly files('libs/jei-1.21.1-neoforge-19.36.0.360.jar')

    // Iris 光影兼容（仅编译时需要，运行时由 Iris 提供）
    // 用于编译 Iris Mixin 中引用的 net.irisshaders.iris.* 类
    compileOnly("maven.modrinth:iris:1.8.8+1.21.1-neoforge")

    // Applied Energistics 2（可选依赖，编译时需要访问 AE2 网格 API）
    // 用于 mek.ae2 包的 IGridNode / StorageHelper.poweredInsert 集成
    // 运行时通过反射隔离，未安装 AE2 时 mek.ae2 包类永不加载
    compileOnly files('libs/appliedenergistics2-1.21.1-19.2.17.jar')

    // AppliedFlux（可选依赖，编译时需要访问 FluxKey / EnergyType 类）
    // 用于 v1.8.0 AE2 网络能量输入集成：从 ME 网络提取存储的 FE 能量
    // 运行时通过 AppliedFluxIntegrationLoader.isAppliedFluxLoaded() 守卫，
    // 未安装 AppliedFlux 时 extractAppliedFluxFe 方法入口即返回 0，不触发类加载
    compileOnly files('libs/AppliedFlux-1.21-2.1.5-neoforge.jar')

    // Jade（可选依赖，编译时需要访问 Jade API 显示 AE2 网络状态）
    // @WailaPlugin 注解确保仅 Jade 安装时才加载集成类
    compileOnly name: 'Jade-1.21.1-NeoForge-15.10.5'

    // KubeJS（可选依赖，编译时需要访问 KubeJSPlugin/EventGroup 等 API）
    // 运行时通过 kubejs.plugins.txt 声明插件，未安装 KubeJS 时插件类不会被加载
    compileOnly name: 'kubejs-neoforge-2101.7.2-build.368'
    // Rhino（KubeJS 的 JS 引擎依赖，编译时 KubeJS API 类签名引用 Rhino 类型）
    compileOnly name: 'rhino-2101.2.7-build.85'

    // 单元测试依赖（JUnit 5）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft/NeoForge supply these in-game; plain JVM tests need them explicitly.
    testRuntimeOnly 'com.electronwill.night-config:toml:3.8.3'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.15'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 发布 JAR 不需要调试符号，减少 class 文件体积；源码调试仍可通过本地构建覆盖此选项。
    options.debug = false
    // 启用弃用警告详细输出，便于持续监控 API 迁移
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 单元测试配置 — 启用JUnit 5 Platform
tasks.named('test', Test) {
    useJUnitPlatform()
}

def releaseModId = mod_id.toString()
def releaseModVersion = mod_version.toString()
def releaseCurseForgeVersion = curseforge_release_version.toString()

tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    // 防止未来误将备份或临时素材放入资源源目录后进入发布 JAR
    exclude('**/texture_backups/**', '**/tmp_*/**', '**/*backup*')
    manifest {
        attributes(
                'Implementation-Title': 'Productive Bees Genesis',
                'Implementation-Version': releaseModVersion,
                'CurseForge-Release-Version': releaseCurseForgeVersion,
                'Minecraft-Version': minecraft_version
        )
    }
    from('LICENSE') {
        rename { "LICENSE_${releaseModId}" }
    }
    from('THIRD_PARTY_LICENSES.md') {
        rename { "THIRD_PARTY_LICENSES_${releaseModId}.md" }
    }
}

def verifyReleaseArtifact = tasks.register('verifyReleaseArtifact') {
    group = 'verification'
    description = 'Verifies the distributable JAR metadata and required release files.'
    def releaseJar = tasks.named('jar', Jar)
    dependsOn releaseJar
    inputs.file(releaseJar.flatMap { it.archiveFile })

    doLast { task ->
        File artifact = task.inputs.files.singleFile
        if (!artifact.isFile()) {
            throw new GradleException("Release artifact was not created: ${artifact}")
        }

        def zip = new java.util.zip.ZipFile(artifact)
        try {
            def requiredEntries = [
                    'META-INF/MANIFEST.MF',
                    'META-INF/neoforge.mods.toml',
                    'productivebeesgenesis.png',
                    "LICENSE_${releaseModId}",
                    "THIRD_PARTY_LICENSES_${releaseModId}.md"
            ]
            requiredEntries.each { entryName ->
                if (zip.getEntry(entryName) == null) {
                    throw new GradleException("Release artifact is missing ${entryName}")
                }
            }

            def manifest = new java.util.jar.Manifest(
                    zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
            def attributes = manifest.mainAttributes
            if (attributes.getValue('Implementation-Version') != releaseModVersion) {
                throw new GradleException('Manifest Implementation-Version does not match mod_version')
            }
            if (attributes.getValue('CurseForge-Release-Version') != releaseCurseForgeVersion) {
                throw new GradleException('Manifest CurseForge-Release-Version does not match release metadata')
            }

            String modsToml = zip.getInputStream(zip.getEntry('META-INF/neoforge.mods.toml'))
                    .getText('UTF-8')
            if (!modsToml.contains("version=\"${releaseModVersion}\"")) {
                throw new GradleException('neoforge.mods.toml does not contain the expected mod version')
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn verifyReleaseArtifact
}

# 资源蜜蜂：创世模组配置文件
# NeoForge 1.21.1 版本
# 配置文件说明：
#   - 主mod入口: ProductiveBeesGenesis (通用)
#   - 客户端入口: ProductiveBeesGenesisClient (仅客户端，注册配置屏幕)

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ayoshiko/productive-bees-genesis/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="资源蜜蜂：创世"
authors="${mod_authors}"
description='''资源蜜蜂的附属模组，添加了万象创世蜜蜂，可以产出整合包中所有资源蜜蜂的蜜脾。

特性：
- 添加万象创世蜜蜂实体
- 随机产出任意蜜蜂的蜜脾
- 游戏内配置界面支持（中英文）
- 离心机空转拦截优化'''

[[mixins]]
config="${mod_id}.mixins.json"

# 主mod入口（非客户端）
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="productivebees"
    type="required"
    versionRange="[1.21.1-13.13.5,)"
    ordering="AFTER"
    side="BOTH"

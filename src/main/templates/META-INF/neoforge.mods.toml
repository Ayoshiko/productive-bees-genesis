# 资源蜜蜂：创世模组配置文件
# NeoForge 1.21.1 版本
# 配置文件说明：
#   - 主mod入口: ProductiveBeesGenesis (通用)
#   - 客户端入口: ProductiveBeesGenesisClient (仅客户端，注册配置屏幕)

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ayoshiko/productive-bees-genesis/issues"
displayURL="https://github.com/Ayoshiko/productive-bees-genesis"
credits="Thanks to: Productive Bees, Mekanism, NeoForge, Re:Avaritia, Applied Energistics 2, KubeJS, Jade, Just Enough Items, Super Factory Manager, Mekanism Unleashed, Mekanism Empowered, EvolvedMekanism, EvolvedMekanismExtras, Applied Flux, Mek-Energistics, Iris teams"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Productive Bees Genesis"
logoFile="productivebeesgenesis.png"
authors="${mod_authors}"
description='''
A concise Productive Bees addon with the Myriad Creations Bee, Mekanism apiaries and centrifuges, AE2 integration, KubeJS recipe hooks, and cosmic rendering.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Iris 光影兼容 Mixin 配置（仅当 Iris 已安装时由 IrisConfigPlugin 应用）
[[mixins]]
config="${mod_id}.iris.mixins.json"

# 主mod入口（非客户端）
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="productivebees"
    type="required"
    versionRange="[1.21.1-13.13.5,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism 必需依赖（MEK离心机基于Mekanism API）
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="required"
    versionRange="[10.7.14.79,)"
    ordering="AFTER"
    side="BOTH"

# EvolvedMekanism 可选依赖（提供OVERCLOCKED/QUANTUM/DENSE/MULTIVERSAL/CREATIVE高等级工厂）
[[dependencies.${mod_id}]]
    modId="evolvedmekanism"
    type="optional"
    versionRange="[1.2.1,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism Extras 可选依赖（提供ABSOLUTE/SUPREME/COSMIC/INFINITE等级，后续任务支持）
[[dependencies.${mod_id}]]
    modId="mekanism_extras"
    type="optional"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

# EvolvedMekanismExtras 可选依赖（提供交叉等级，后续任务支持）
[[dependencies.${mod_id}]]
    modId="emextras"
    type="optional"
    versionRange="[1.2.1,)"
    ordering="AFTER"
    side="BOTH"

# MekanismEmpowered 可选依赖（提供强化速度/能量、IO容量、自动插入器、快速物品插入/弹出升级）
# 通过反射访问 MekEmpUpgrade API，未安装时安全降级为基础升级集合
[[dependencies.${mod_id}]]
    modId="mekanism_empowered"
    type="optional"
    versionRange="[21.1-1.2.2,)"
    ordering="AFTER"
    side="BOTH"

# Iris 光影可选依赖（提供着色器兼容层，仅客户端）
# IrisConfigPlugin 会检测 Iris 是否安装，仅安装时才应用 Iris Mixin
[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    ordering="AFTER"
    side="CLIENT"
    versionRange="[1.8.8,)"

# Super Factory Manager 可选依赖（仅保证加载顺序）
# 离心机继承 Mekanism 的 TileEntityElectricMachine，自动暴露 IItemHandler/IEnergyStorage/IFluidHandler，
# SFM 通过 NeoForge Capability 系统访问这些接口，应已天然兼容，此处声明仅为确保加载顺序。
# versionRange 0.3.0+ 为 NeoForge 1.21.1 分支首个稳定版本，过宽的范围（如 [0,)）会匹配到老版 Forge 上的不兼容版本。
[[dependencies.${mod_id}]]
    modId="sfm"
    type="optional"
    versionRange="[0.3.0,)"
    ordering="AFTER"
    side="BOTH"

# Applied Energistics 2 可选依赖（提供直接 AE2 网络输出集成）
# 当 AE2 存在且配置开启时，离心机可作为 AE2 网格节点主动推送输出，绕过 SFM 中介
# 未安装 AE2 时 mek.ae2 包类永不加载（反射隔离），完全回退到 SFM/Ejector 路径
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.2.0,)"
    ordering="AFTER"
    side="BOTH"

# Jade 可选依赖（提供方块实体信息悬停显示，显示 AE2 网络连接状态）
# @WailaPlugin 注解确保仅 Jade 安装时才加载集成类，未安装时无影响
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.10.0,)"
    ordering="AFTER"
    side="CLIENT"

# KubeJS 可选依赖（提供脚本化蜜蜂配方注册能力）
# 通过 kubejs.plugins.txt 声明插件，仅 KubeJS 安装时加载兼容类
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[2101.7.2,)"
    ordering="AFTER"
    side="BOTH"

# Applied Flux 可选依赖（提供 AE2 网络中 FE 能量提取能力）
# 通过 AppliedFluxIntegrationLoader.isAppliedFluxLoaded() 守卫，未安装时不触发类加载
# versionRange 使用 1.21-2.1.5-neoforge 格式匹配作者实际版本号（前缀 1.21- 表明 MC 版本）
[[dependencies.${mod_id}]]
    modId="appflux"
    type="optional"
    versionRange="[1.21-2.1.5-neoforge,)"
    ordering="AFTER"
    side="BOTH"

# Just Enough Items 可选依赖（提供配方查看集成）
# JEI 集成通过 @JeiPlugin 注解自动加载，JeiRecipeHider 通过反射隐藏冲突配方
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="CLIENT"

# Just Dire Things Extras 可选依赖（提供 CoalescedAcceleratedMachine 合并加速接口）
# 0.5.5 及以上版本均可用；运行时经 MixinConfigPlugin 条件应用，未安装时跳过 JDTE Mixin
[[dependencies.${mod_id}]]
    modId="jdte"
    type="optional"
    versionRange="[0.5.5,)"
    ordering="AFTER"
    side="BOTH"

# Building Gadgets 2 可选依赖（渲染方块实体加载时序修复 Mixin）
[[dependencies.${mod_id}]]
    modId="buildinggadgets2"
    type="optional"
    ordering="AFTER"
    side="CLIENT"

# Mek Energistics 可选依赖（ME 网络能量优先级集成守卫）
[[dependencies.${mod_id}]]
    modId="mekenergistics"
    type="optional"
    ordering="AFTER"
    side="BOTH"

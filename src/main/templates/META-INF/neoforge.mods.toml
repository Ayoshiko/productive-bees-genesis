# 资源蜜蜂：创世模组配置文件
# NeoForge 1.21.1 版本
# 配置文件说明：
#   - 主mod入口: ProductiveBeesGenesis (通用)
#   - 客户端入口: ProductiveBeesGenesisClient (仅客户端，注册配置屏幕)

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ayoshiko/productive-bees-genesis/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Productive Bees Genesis"
authors="${mod_authors}"
description='''
资源蜜蜂：创世 / Productive Bees Genesis
一个资源蜜蜂（Productive Bees）附属模组。

中文：添加万象创世蜜蜂，可产出整合包内所有资源蜜蜂的蜜脾；万象创世蜜脾/蜜脾块拥有星空材质特效；深度集成 Mekanism 离心机，覆盖基础机器与 Mekanism / Mekanism Extras / Evolved Mekanism / Evolved Mekanism Extras 全工厂等级，并优化产物弹出速度；附带宇宙星空渲染系统与蜜蜂过滤配置界面。

English: A Productive Bees addon featuring the Myriad Creations Bee with cosmic starfield-textured honeycombs and honeycomb blocks. Includes deep Mekanism centrifuge integration with optimized ejection speed across all factory tiers (Mekanism, ME, EM, EME), cosmic shader rendering system with Iris compatibility, and a configurable bee filter UI.
'''

[[mixins]]
config="${mod_id}.mixins.json"

# Iris 光影兼容 Mixin 配置（仅当 Iris 已安装时由 IrisConfigPlugin 应用）
[[mixins]]
config="${mod_id}.iris.mixins.json"

# 主mod入口（非客户端）
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="productivebees"
    type="required"
    versionRange="[1.21.1-13.13.5,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism 必需依赖（MEK离心机基于Mekanism API）
[[dependencies.${mod_id}]]
    modId="mekanism"
    type="required"
    versionRange="[10.7.14.79,)"
    ordering="AFTER"
    side="BOTH"

# EvolvedMekanism 可选依赖（提供OVERCLOCKED/QUANTUM/DENSE/MULTIVERSAL/CREATIVE高等级工厂）
[[dependencies.${mod_id}]]
    modId="evolvedmekanism"
    type="optional"
    versionRange="[1.2.1,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism Extras 可选依赖（提供ABSOLUTE/SUPREME/COSMIC/INFINITE等级，后续任务支持）
[[dependencies.${mod_id}]]
    modId="mekanism_extras"
    type="optional"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

# EvolvedMekanismExtras 可选依赖（提供交叉等级，后续任务支持）
[[dependencies.${mod_id}]]
    modId="evolvedmekanism_extras"
    type="optional"
    versionRange="[1.2.1,)"
    ordering="AFTER"
    side="BOTH"

# Mekanism Unleashed 可选依赖（扩展升级上限，支持每tick多次操作）
[[dependencies.${mod_id}]]
    modId="mekanism_unleashed"
    type="optional"
    versionRange="[0.3.0,)"
    ordering="AFTER"
    side="BOTH"

# Iris 光影可选依赖（提供着色器兼容层，仅客户端）
# IrisConfigPlugin 会检测 Iris 是否安装，仅安装时才应用 Iris Mixin
[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    ordering="AFTER"
    side="CLIENT"
    versionRange="[1.8.8,)"

# Super Factory Manager 可选依赖（仅保证加载顺序）
# 离心机继承 Mekanism 的 TileEntityElectricMachine，自动暴露 IItemHandler/IEnergyStorage/IFluidHandler，
# SFM 通过 NeoForge Capability 系统访问这些接口，应已天然兼容，此处声明仅为确保加载顺序。
[[dependencies.${mod_id}]]
    modId="sfm"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Applied Energistics 2 可选依赖（提供直接 AE2 网络输出集成）
# 当 AE2 存在且配置开启时，离心机可作为 AE2 网格节点主动推送输出，绕过 SFM 中介
# 未安装 AE2 时 mek.ae2 包类永不加载（反射隔离），完全回退到 SFM/Ejector 路径
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[19.2.0,)"
    ordering="AFTER"
    side="BOTH"

# Jade 可选依赖（提供方块实体信息悬停显示，显示 AE2 网络连接状态）
# @WailaPlugin 注解确保仅 Jade 安装时才加载集成类，未安装时无影响
[[dependencies.${mod_id}]]
    modId="jade"
    type="optional"
    versionRange="[15.10.0,)"
    ordering="AFTER"
    side="CLIENT"

# Gradle 配置
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft 和 NeoForge 版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.214
loader_version_range=[4,)

# 模组属性
mod_id=productivebeesgenesis
mod_name=资源蜜蜂：创世
mod_license=MIT
mod_version=1.8.1
mod_group_id=com.ayoshiko
mod_authors=Ayoshiko
mod_description=A Productive Bees addon featuring the Myriad Creations Bee with cosmic starfield-textured honeycombs and honeycomb blocks (material mapped from Infinity Creation comb). Includes deep Mekanism centrifuge integration with optimized ejection speed across all factory tiers (Mekanism, Mekanism Extras, Evolved Mekanism Extras), cosmic shader rendering system with Iris compatibility, and a configurable bee filter UI.

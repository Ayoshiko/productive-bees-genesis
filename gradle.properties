# Gradle 配置
org.gradle.jvmargs=-Xmx2G -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft 和 NeoForge 版本
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.214
loader_version_range=[4,)

# 模组属性
mod_id=productivebeesgenesis
mod_name=资源蜜蜂：创世
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.ayoshiko
mod_authors=Ayoshiko
mod_description=资源蜜蜂（Productive Bees）的附属模组，新增万象创世与无尽·创世两只传奇蜜蜂。万象创世蜜蜂拥有 8 秒慢速彩虹渐变与华丽粒子特效，可产出整合包内几乎所有蜜蜂的蜜脾；无尽·创世蜜蜂自带宇宙星空光晕，产物可随机转化为其他蜜蜂蜜脾。同时提供与 Mekanism 深度集成的离心机（含 17 级工厂版本）、中英双语配置界面、蜜蜂过滤系统，并针对 PB 原版离心机空转耗能进行优化。

name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub Release tag whose JAR should be mirrored
        required: true
        default: v1.0.1
        type: string
      version_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Bilingual release body containing a ## English section
        required: true
        default: "## English\nManual CurseForge upload."
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Normalize release metadata
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.version }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download verified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.version }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="productivebeesgenesis-${RELEASE_VERSION}.jar"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${artifact}"
          mkdir -p build/libs
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/octet-stream' \
            "$url" --output "build/libs/${artifact}"
          test -s "build/libs/${artifact}"

      - name: Extract English changelog for CurseForge
        id: curseforge_changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body || github.event.inputs.changelog }}
        shell: bash
        run: |
          english="$(printf '%s\n' "$RELEASE_BODY" | awk 'BEGIN {found=0} /^## English[[:space:]]*$/ {found=1; next} found {print}')"
          if [ -z "$(printf '%s' "$english" | tr -d '[:space:]')" ]; then
            echo "Release body must contain a non-empty ## English section." >&2
            exit 1
          fi
          {
            echo 'changelog<<EOF'
            printf '%s\n' "$english"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Productive Bees Genesis ${{ steps.release_meta.outputs.version }}
          version: ${{ steps.release_meta.outputs.version }}
          version-type: ${{ github.event.inputs.version_type || 'release' }}
          changelog: ${{ steps.curseforge_changelog.outputs.changelog }}

          dependencies: |
            curseforge:223794(required)
            curseforge:268560(required)
            curseforge:574300(required)

          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21

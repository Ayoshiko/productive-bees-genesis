name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing verified NeoForge GitHub Release tag to mirror
        required: true
        type: string
      version_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Bilingual release body containing a ## English section
        required: true
        default: "## English\nManual CurseForge upload."
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified NeoForge artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.prerelease && !contains(github.event.release.tag_name, '-forge-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout maintenance verification tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main-neo/1.21.1
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare the published NeoForge attachment
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.version }}
          INPUT_VERSION_TYPE: ${{ github.event.inputs.version_type }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: timeout --signal=TERM --kill-after=5s 250s python3 .github/scripts/release_artifact.py mirror

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.release.outputs.artifact }}

          # Match historical CurseForge entries: derive the version name from the JAR filename.
          curseforge-name: ""
          version: ${{ steps.release.outputs.version }}
          version-type: ${{ steps.release.outputs.version_type }}
          changelog: ${{ steps.release.outputs.changelog }}

          dependencies: |
            curseforge:377897(required)
            curseforge:268560(required)
            curseforge:223794(optional)

          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21

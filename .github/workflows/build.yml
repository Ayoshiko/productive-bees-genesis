name: Forge build

on:
  push:
    branches: ['forge/1.20.1', 'port/forge-1.20.1-*']
  pull_request:
    branches: ['forge/1.20.1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Restore verified Forge compile inputs
        run: python3 tools/prepare_forge_dependencies.py
      - name: Compile and reobfuscate distributable
        run: ./gradlew --no-daemon jarJar reobfJarJar
      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: productivebeesgenesis-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error

name: Forge build

on:
  push:
    branches: ['forge/1.20.1', 'port/forge-1.20.1-*']
  pull_request:
    branches: ['forge/1.20.1']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Restore verified Forge compile inputs
        run: python3 tools/prepare_forge_dependencies.py
      - name: Compile and reobfuscate distributable
        run: ./gradlew --no-daemon jarJar reobfJarJar
      - name: Verify Forge artifact boundaries
        run: python3 tools/verify_forge_artifact.py
      - name: Upload Forge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productivebeesgenesis-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error

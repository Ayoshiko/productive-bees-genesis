name: Build

on:
  push:
    branches:
      - main-neo/1.21.1
      - bees-processing-network/1.21.1
    tags: ['v*']
  pull_request:
    branches: ['main-neo/1.21.1', 'bees-processing-network/1.21.1']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge 1.21.1 build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Prepare pinned development dependencies
        run: python3 .github/scripts/build_dependencies.py

      - name: Build and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          tasks=(build verifyReleaseArtifact verifyNoExampleBeesInJar)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tasks+=(verifyDistributionPermissions)
          fi
          timeout --signal=TERM --kill-after=5s 280s bash ./gradlew --no-daemon "${tasks[@]}" --stacktrace

      - name: Record exact build provenance
        run: python3 .github/scripts/release_artifact.py record

      - name: Upload mod JAR and build proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: productivebeesgenesis-neoforge-1.21.1
          if-no-files-found: error
          path: build/ci/release/*
